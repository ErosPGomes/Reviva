name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo necessário: ler o código, publicar no Pages e emitir o token OIDC do deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo espera o anterior terminar em vez de cancelá-lo no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Testes antes do build: regressão no modelo de voo/terreno não chega ao site.
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
